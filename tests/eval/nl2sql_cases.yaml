# NL2SQL 评测集
#
# 每题给出 question（用户自然语言）与 gold_sql（权威 SQL）。
# 评测口径：
#   EM（Exact Match）——生成 SQL 与 gold_sql 规范化后完全一致；
#   EX（Execution Accuracy）——两者各自执行，结果集（行/列无序）一致。
#
# 说明：数仓 fixture 仅覆盖 2025-01-01 ~ 2025-03-31，故所有用例都落在这段时间内。
# 事实表 fact_order(order_id, customer_id, product_id, date_id, region_id, order_quantity, order_amount)
# 维度表 dim_region / dim_customer / dim_product / dim_date
# date_id 为 INT 型 YYYYMMDD，时间过滤统一用半开区间 [start, end)。
cases:
  # —— 单指标聚合 ——
  - id: E-01
    question: 统计2025年第一季度的GMV
    gold_sql: SELECT SUM(order_amount) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 单指标聚合 + 绝对季度

  - id: E-02
    question: 统计2025年第一季度的订单量
    gold_sql: SELECT COUNT(DISTINCT order_id) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 去重计数口径

  - id: E-03
    question: 统计2025年第一季度的销量
    gold_sql: SELECT SUM(order_quantity) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 销量=件数求和

  - id: E-04
    question: 2025年第一季度的客单价是多少
    gold_sql: SELECT AVG(order_amount) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 客单价=AOV

  - id: E-05
    question: 2025年第一季度有多少个下单客户
    gold_sql: SELECT COUNT(DISTINCT customer_id) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 下单客户数=去重客户

  # —— 时间粒度 ——
  - id: E-06
    question: 2025年1月的GMV
    gold_sql: SELECT SUM(order_amount) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250201
    note: 绝对月份

  - id: E-07
    question: 统计2025年第一季度每个月的GMV
    gold_sql: SELECT d.month, SUM(f.order_amount) FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY d.month
    note: 按月份分组

  # —— 分组 + 排序 + TopN ——
  - id: E-08
    question: 统计2025年第一季度各大区的GMV，按GMV从高到低排序
    gold_sql: SELECT r.region_name, SUM(f.order_amount) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY r.region_name ORDER BY SUM(f.order_amount) DESC
    note: 单维分组 + 排序

  - id: E-09
    question: 统计2025年3月各商品品类的销售额
    gold_sql: SELECT p.category, SUM(f.order_amount) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250301 AND f.date_id < 20250401 GROUP BY p.category
    note: 品类分组 + 月份过滤

  - id: E-10
    question: 查询2025年第一季度销售额最高的前5个商品
    gold_sql: SELECT p.product_name, SUM(f.order_amount) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.product_name ORDER BY SUM(f.order_amount) DESC LIMIT 5
    note: 分组 + TopN

  - id: E-11
    question: 按会员等级统计2025年第一季度的订单量
    gold_sql: SELECT c.member_level, COUNT(DISTINCT f.order_id) FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY c.member_level
    note: 会员等级分组

  - id: E-12
    question: 2025年第一季度各品牌的销量
    gold_sql: SELECT p.brand, SUM(f.order_quantity) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.brand
    note: 品牌分组 + 销量

  # —— 条件过滤 ——
  - id: E-13
    question: 统计华东地区2025年第一季度的GMV
    gold_sql: SELECT SUM(f.order_amount) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name = '华东' AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: 维表等值过滤

  - id: E-14
    question: 2025年第一季度男性和女性客户分别贡献了多少GMV
    gold_sql: SELECT c.gender, SUM(f.order_amount) FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY c.gender
    note: 性别分组

  - id: E-15
    question: 统计2025年3月华东地区的GMV
    gold_sql: SELECT SUM(f.order_amount) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name = '华东' AND f.date_id >= 20250301 AND f.date_id < 20250401
    note: 月份 + 地区双重过滤

  # —— 多指标 ——
  - id: E-16
    question: 2025年第一季度的GMV和订单量分别是多少
    gold_sql: SELECT SUM(order_amount), COUNT(DISTINCT order_id) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401
    note: 同一行多指标

  # —— 排序方向 / 特殊 ——
  - id: E-17
    question: 2025年第一季度各地区的订单量，按订单量从高到低排序
    gold_sql: SELECT r.region_name, COUNT(DISTINCT f.order_id) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY r.region_name ORDER BY COUNT(DISTINCT f.order_id) DESC
    note: 地区分组 + 计数排序

  - id: E-18
    question: 查询2025年第一季度销量最高的商品
    gold_sql: SELECT p.product_name, SUM(f.order_quantity) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.product_name ORDER BY SUM(f.order_quantity) DESC LIMIT 1
    note: TopN=1

  - id: E-19
    question: 2025年第一季度各商品类别的平均订单金额
    gold_sql: SELECT p.category, AVG(f.order_amount) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.category
    note: 分组 + 均值

  - id: E-20
    question: 统计2025年第一季度华北地区的销量
    gold_sql: SELECT SUM(f.order_quantity) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name = '华北' AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: 地区 + 销量

  # —— 多表关联（三表 JOIN）——
  - id: E-21
    question: 统计2025年第一季度各品牌在各地区的GMV
    gold_sql: SELECT p.brand, r.region_name, SUM(f.order_amount) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id JOIN dim_region r ON f.region_id = r.region_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.brand, r.region_name
    note: 三表关联 + 品牌×地区双维度分组

  - id: E-22
    question: 统计2025年第一季度各会员等级购买的各品类的销量
    gold_sql: SELECT c.member_level, p.category, SUM(f.order_quantity) FROM fact_order f JOIN dim_customer c ON f.customer_id = c.customer_id JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY c.member_level, p.category
    note: 三表关联 + 会员×品类交叉

  - id: E-23
    question: 2025年第一季度华东地区男性客户贡献的GMV
    gold_sql: SELECT SUM(f.order_amount) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id JOIN dim_customer c ON f.customer_id = c.customer_id WHERE r.region_name = '华东' AND c.gender = '男' AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: 三表关联 + 双重维过滤

  # —— 分组后过滤 HAVING ——
  - id: E-24
    question: 统计2025年第一季度销量超过50件的商品品类
    gold_sql: SELECT p.category, SUM(f.order_quantity) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY p.category HAVING SUM(f.order_quantity) > 50
    note: GROUP BY + HAVING 过滤

  # —— 复杂条件 ——
  - id: E-25
    question: 统计2025年第一季度手机数码和家用电器两个品类的GMV
    gold_sql: SELECT SUM(f.order_amount) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE p.category IN ('手机数码', '家用电器') AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: IN 列表过滤

  - id: E-26
    question: 统计2025年第一季度除华东地区以外的GMV
    gold_sql: SELECT SUM(f.order_amount) FROM fact_order f JOIN dim_region r ON f.region_id = r.region_id WHERE r.region_name != '华东' AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: 排除条件 !=

  - id: E-27
    question: 2025年第一季度名字里带牛奶的商品销量是多少
    gold_sql: SELECT SUM(f.order_quantity) FROM fact_order f JOIN dim_product p ON f.product_id = p.product_id WHERE p.product_name LIKE '%牛奶%' AND f.date_id >= 20250101 AND f.date_id < 20250401
    note: 模糊匹配 LIKE

  # —— 子查询 ——
  - id: E-28
    question: 2025年第一季度订单金额超过平均订单金额的订单有多少个
    gold_sql: SELECT COUNT(*) FROM fact_order WHERE order_amount > (SELECT AVG(order_amount) FROM fact_order WHERE date_id >= 20250101 AND date_id < 20250401) AND date_id >= 20250101 AND date_id < 20250401
    note: 标量子查询 + 条件比较

  # —— 多维度多指标交叉 ——
  - id: E-29
    question: 统计2025年第一季度各月各地区的订单量和GMV
    gold_sql: SELECT d.month, r.region_name, COUNT(DISTINCT f.order_id), SUM(f.order_amount) FROM fact_order f JOIN dim_date d ON f.date_id = d.date_id JOIN dim_region r ON f.region_id = r.region_id WHERE f.date_id >= 20250101 AND f.date_id < 20250401 GROUP BY d.month, r.region_name
    note: 月×地区双维度 + 双指标

  # —— 跨月区间 ——
  - id: E-30
    question: 统计2025年2月到3月的GMV
    gold_sql: SELECT SUM(order_amount) FROM fact_order WHERE date_id >= 20250201 AND date_id < 20250401
    note: 跨月区间过滤
