logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3307
  user: didilili
  password: ${oc.env:MYSQL_PASSWORD}
  database: meta

db_dw:
  host: localhost
  port: 3307
  user: didilili
  password: ${oc.env:MYSQL_PASSWORD}
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: qwen3.7-flash-2026-07-15
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://ws-vkc7y1qja48h6kn0.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  # 关闭思维链（thinking）的节点。当前模型默认开启 thinking，实测每次调用约 97% 的
  # 输出 token 花在 reasoning 上（一次扩展“想” 480 token / 8.32s，而答案只有 8 token）；
  # 关掉后同 prompt 0.73s 返回、答案不变。此处列出的都是“轻任务”节点：
  #   recall_*  = 关键词扩展（词汇联想，不需要长链推理）
  #   filter_*  = 从候选里挑选（同样不需要长链推理）
  # generate_sql 刻意不在此列——生成正确 SQL 更依赖模型推理，保留 thinking。
  # 回滚：把节点名从本列表删掉即可恢复该节点的 thinking。
  no_think_nodes:
    - recall_column
    - recall_value
    - recall_metric
    - filter_table
    - filter_metric

sql_guard:
  max_rows: 1000

# 单次问数绝对期限（秒）；预登记即开始计时，重连不延长。
query_run_timeout_seconds: 300

# 可观测（链路追踪）。enable=false 时节点不做任何埋点，性能零损耗；
# sample_rate 控制采样比例（1.0 = 全采，本地开发默认全采）；
# store_span=false 时只写 trace 头表，不写 trace_span 明细（高并发场景省写入）。
observability:
  enable: true
  sample_rate: 1.0
  store_span: true

# 多路召回的并发控制。三路召回会按关键词并发检索（先批量向量化再并发查询），
# concurrency 限制单路内部"同时在飞"的请求数，防止关键词较多时瞬时打爆
# Qdrant / Elasticsearch。<=0 表示不限制。
recall:
  concurrency: 8

# 角色权限（RBAC）。region_ids 为空的角色不做行级过滤（全量可见）；
# mask_columns 列出需要列级脱敏的字段名（按结果列名匹配）。
# 区域 id 映射见 conf/meta_config.yaml：华东=R002/R005、华南=R001、华北=R004、西南=R003、华中=R006
rbac:
  default_role: guest
  roles:
    admin:
      region_ids: []
      mask_columns: []
    east_manager:
      region_ids: ["R002", "R005"]
      mask_columns: []
    analyst:
      region_ids: []
      mask_columns: ["customer_name"]
    guest:
      region_ids: ["R002", "R005"]
      mask_columns: ["customer_name"]

# 鉴权（JWT）。核心设计：**角色由服务端决定，不由客户端指定**。
# 客户端拿到的是一张服务端签过名的令牌，能验证真伪、带过期时间；
# 想改角色就必须改令牌内容，而改了签名就对不上——这正是它比 X-User-Role
# 请求头（客户端自己写"我是管理员"）强的地方。
auth:
  # 刻意不提供"关闭鉴权"的开关：配置里的一个 false 就能把系统敞开，
  # 这是比漏洞本身更常见的事故来源。确需绕过请改代码并走 review。
  # 签名密钥必须来自环境变量；启动时若为空或过短会直接启动失败，避免"带病上线"。
  secret_key: ${oc.env:JWT_SECRET}
  # 服务端固定使用该算法校验，**绝不读取令牌头里的 alg 字段**
  # （否则攻击者可声明 alg=none 或 HS/RS 混淆来绕过验签）。
  algorithm: HS256
  issuer: shopkeeper-agent
  # 令牌有效期（分钟）。过期后必须重新登录换新令牌。
  expire_minutes: 120
  # --- 以下为「演示用签发点」，生产环境必须删除或置为 false ---
  # 用共享口令换取令牌。注意角色不是请求里带的，而是下面的 dev_users 按用户名查出来的，
  # 所以客户端无法直接要一个 admin 令牌（除非拿 admin 的账号登录）。
  # 生产替换点：改接公司 SSO / LDAP，或查用户表并校验密码哈希（如 argon2 / bcrypt）。
  dev_login_enable: true
  dev_login_password: ${oc.env:DEV_LOGIN_PASSWORD}
  dev_users:
    boss: admin
    east: east_manager
    analyst: analyst
    guest: guest
